<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Radhe Bharadwaj, founder of Pixra Global, building QuduHub">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1c232d"/></pattern>
    <radialGradient id="glow" cx="0" cy="1" r="0.9"><stop offset="0" stop-color="#e5383b" stop-opacity=".28"/><stop offset="1" stop-color="#e5383b" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#e5383b" stop-opacity="0"/><stop offset=".5" stop-color="#e5383b" stop-opacity=".9"/><stop offset="1" stop-color="#e5383b" stop-opacity="0"/></linearGradient>
    <linearGradient id="spark" x1="0" x2="1"><stop offset="0" stop-color="#ff6b6e" stop-opacity="0"/><stop offset=".7" stop-color="#ff6b6e"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="#0d1117"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="17.5" fill="none" stroke="#30363d"/>
  <rect x="80" y="52" width="56" height="3" rx="1.5" fill="#e5383b"/>

  <!-- Name + blinking cursor -->
  <text x="80" y="150" font-family="'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="76" font-weight="800" fill="#f0f6fc" textLength="640" lengthAdjust="spacing">Radhe Bharadwaj</text>
  <rect x="738" y="92" width="20" height="64" fill="#e5383b">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="80" y="198" font-family="'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#8b949e" textLength="560" lengthAdjust="spacing">Founder of Pixra Global. Building QuduHub.</text>
  <text x="80" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#e5383b" textLength="430" lengthAdjust="spacing">AI systems / C++ / humanoid robotics</text>

  <!-- Orbit motif -->
  <g fill="none" stroke="#e5383b">
    <circle cx="990" cy="150" r="52" stroke-opacity=".5"/>
    <circle cx="990" cy="150" r="92" stroke-opacity=".28" stroke-dasharray="3 7"/>
    <circle cx="990" cy="150" r="132" stroke-opacity=".16"/>
  </g>
  <circle cx="990" cy="150" r="7" fill="#e5383b"><animate attributeName="r" values="7;9;7" dur="3s" repeatCount="indefinite"/></circle>
  <g>
    <animateMotion dur="7s" repeatCount="indefinite" path="M 1042 150 a 52 52 0 1 1 -104 0 a 52 52 0 1 1 104 0"/>
    <circle r="9" fill="#e5383b" opacity=".45" filter="url(#blur)"/><circle r="4" fill="#ff6b6e"/>
  </g>
  <g>
    <animateMotion dur="13s" repeatCount="indefinite" path="M 1082 150 a 92 92 0 1 0 -184 0 a 92 92 0 1 0 184 0"/>
    <circle r="9" fill="#e5383b" opacity=".45" filter="url(#blur)"/><circle r="4" fill="#ff6b6e"/>
  </g>
  <g>
    <animateMotion dur="21s" repeatCount="indefinite" path="M 1122 150 a 132 132 0 1 1 -264 0 a 132 132 0 1 1 264 0"/>
    <circle r="7" fill="#e5383b" opacity=".4" filter="url(#blur)"/><circle r="3" fill="#ff6b6e"/>
  </g>

  <!-- Bottom hairline with travelling spark -->
  <rect x="80" y="269.5" width="1040" height="1" fill="url(#line)"/>
  <rect x="-120" y="268" width="120" height="4" rx="2" fill="url(#spark)">
    <animate attributeName="x" from="80" to="1120" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
