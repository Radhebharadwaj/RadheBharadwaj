<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 44" width="900" height="44" role="img" aria-label="Divider">
  <defs>
    <linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#e5383b" stop-opacity="0"/><stop offset="1" stop-color="#e5383b" stop-opacity=".85"/></linearGradient>
    <linearGradient id="r" x1="1" x2="0"><stop offset="0" stop-color="#e5383b" stop-opacity="0"/><stop offset="1" stop-color="#e5383b" stop-opacity=".85"/></linearGradient>
    <linearGradient id="sp" x1="0" x2="1"><stop offset="0" stop-color="#ff6b6e" stop-opacity="0"/><stop offset=".6" stop-color="#ff6b6e"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>
    <clipPath id="c"><rect x="0" y="0" width="420.0" height="44"/><rect x="480.0" y="0" width="420.0" height="44"/></clipPath>
  </defs>
  <rect x="0" y="21.5" width="420.0" height="1" fill="url(#l)"/>
